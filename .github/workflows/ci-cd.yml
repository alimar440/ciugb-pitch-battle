name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests et build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test

      - name: Construire le site
        run: npm run build

      - name: Conserver le build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/ciugb-pitch-battle/browser
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Déployer sur Cloudflare Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ciugb-pitch-battle.pages.dev
    steps:
      - name: Récupérer le build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/ciugb-pitch-battle/browser

      - name: Publier la production
        run: npx wrangler pages deploy dist/ciugb-pitch-battle/browser --project-name ciugb-pitch-battle --branch main --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
